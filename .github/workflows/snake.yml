name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate the Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MrPkMehta
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Commit and Push the Snake SVG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          mkdir -p assets
          cp dist/github-contribution-grid-snake.svg assets/
          git add assets/github-contribution-grid-snake.svg
          git commit -m "Add snake contribution SVG"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
